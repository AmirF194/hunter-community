# yaml-language-server: $schema=https://schema.zeabur.app/template.json
#
# HunterCode 社区版 · Zeabur 一键部署模板
# ════════════════════════════════════════════════════════════════════════
# 部署完成后打开绑定的域名，按首启向导（五步）配置大模型即可对话。
# 初始化口令 HUNTER_SETUP_TOKEN 由模板随机生成，在 api 服务的「变量」里查看。
#
# 字段依据（2026-09-18 查）：
#   · Schema      https://schema.zeabur.app/template.json（本文件已过 draft-07 校验）
#   · 模板格式     https://zeabur.com/docs/en-US/template/template-format
#   · 特殊变量     https://zeabur.com/docs/en-US/deploy/special-variables
#   · compose 迁移 https://github.com/zeabur/zeabur-template-doc/blob/main/docs/DOCKER_COMPOSE_MIGRATION.md
#   · 作者清单     https://github.com/zeabur/zeabur-template-doc/blob/main/docs/CHECKLIST.md
#   · 私有网络     https://zeabur.com/docs/en-US/deploy/networking/private-networking
#
# ⚠️ 两条和本地 docker-compose.yml 不一样的地方，改动原因见 deploy/zeabur/README.md：
#   1. 本地靠 hunter_secrets **共享卷** 让 api / web / opencode 拿到同一把
#      JWT_SECRET 与 HUNTER_INTERNAL_KEY。**Zeabur 不支持跨服务共享卷**
#      （见 DOCKER_COMPOSE_MIGRATION.md「場景 1: 共享 Volume」），所以这里改成
#      由模板生成后经 expose 变量注入 —— 三个服务必须拿到同一个值，否则
#      对话 401、图片 OCR 401，而症状只是「没反应」，极难排查。
#   2. `${PASSWORD}` 是 **每个服务一个** 随机值（特殊变量文档原文：
#      "A random password generated by Zeabur for each service"），一个服务里
#      引用两次拿不到两个不同的值。我们要四把互不相同的密钥，所以把它们
#      「借位」定义在四个不同的服务上再 expose 出去：
#          postgres  → POSTGRES_PASSWORD
#          redis     → HUNTER_SETUP_TOKEN
#          llm-shim  → JWT_SECRET
#          api       → HUNTER_INTERNAL_KEY
#      借位的落点不是随手选的：每个引用方都已经、且必须依赖被借位的服务
#      （Zeabur 要求引用 expose 变量的服务把对方写进 dependencies），
#      这样整张依赖图无环。
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: HunterCode
spec:
  description: 自部署的 AI 投研助手 · A股/港股/美股 · 数据、对话和大模型 key 都留在你自己的实例上
  icon: https://raw.githubusercontent.com/agentpit-io/hunter-community/main/deploy/zeabur/logo.png
  coverImage: https://raw.githubusercontent.com/agentpit-io/hunter-community/main/deploy/zeabur/cover.webp
  tags:
    - AI
    - Finance
    - Tool
  # 资源建议来自 R0 实测（docs/setup-wizard/R0-预研结论.md 第三节）：
  # 六个容器空闲合计 1171 MB，深度分析 + 全市场扫描并发峰值 1271 MB。
  resourceRequirement:
    minConfig:
      cpu: 2
      ram: 2
    recommendedConfig:
      cpu: 2
      ram: 4
  readme: |
    ## HunterCode 社区版

    自部署的 AI 投研助手：A 股 / 港股 / 美股行情、魔法筛选器、深度分析、
    投资组合与自选股跟踪，全部跑在你自己的实例上。

    ### 部署之后做什么

    1. 打开你绑定的域名，会自动进入**首启向导**。
    2. 第 0 步要求输入**初始化口令** —— 打开 Zeabur 控制台里的 `api` 服务 →
       「变量」→ 复制 `HUNTER_SETUP_TOKEN` 的值。
       （这道口令是防止部署完成到你打开页面之间，被别人抢先配置成他的大模型。）
    3. 第 1～5 步：选大模型厂商 → 填你自己的 API key → **当场跑连通/对话/工具调用
       三项测试** → 选数据供给 → 完成。配置写进数据库并热生效，**不需要重启容器**。
    4. 之后就能直接对话了。

    ### 你需要自备什么

    - 一把 OpenAI 兼容的大模型 API key（DeepSeek / 通义 / Moonshot / OpenAI /
      Anthropic / 自建网关都行）。模板**不要求**你在部署前填写，向导里填。

    ### 数据放在哪

    | 内容 | 位置 |
    |---|---|
    | 业务数据（自选股、组合、研究台、配置、大模型 key 密文） | `postgres` 服务的卷 |
    | 对话正文与会话 | `opencode` 服务的卷 `/home/hunter/.local` |
    | 你装的 SKILL、导入的数据包 | `api` 服务的两个卷 |

    ### 升级

    把六个服务里四个 `ghcr.io/agentpit-io/hunter-community-*` 镜像的标签一起换成
    新版本再重新部署即可。api 启动时会自动补跑数据库迁移（带 advisory lock 与
    记账表），**不需要手工执行 SQL**。

    ### 更多

    - 源码与文档：https://github.com/agentpit-io/hunter-community
    - Zeabur 部署说明：https://github.com/agentpit-io/hunter-community/blob/main/docs/deploy/zeabur.md
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: 访问域名
      description: 绑定一个域名来打开 HunterCode。部署完成后打开它，按首启向导配置大模型。

  services:
    # ── postgres · 业务数据 ────────────────────────────────────────────
    - name: postgres
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/postgresql.svg
      template: PREBUILT_V2
      spec:
        source:
          image: postgres:16-alpine
        ports:
          - id: database
            port: 5432
            type: TCP
        # 数据库只给项目内部用，关掉对外转发链接
        portForwarding:
          enabled: false
        # TCP 探针 · 让平台知道数据库到底起来没有（api 那边也有 connect_with_retry 兜底）
        healthCheck:
          type: TCP
          port: database
        volumes:
          - id: pgdata
            dir: /var/lib/postgresql/data
        env:
          POSTGRES_USER:
            default: hunter
            expose: true
          # 借位点 1/4 · postgres 自己的 ${PASSWORD}
          POSTGRES_PASSWORD:
            default: ${PASSWORD}
            expose: true
          POSTGRES_DB:
            default: hunter
            expose: true
          POSTGRES_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          POSTGRES_PORT:
            default: ${DATABASE_PORT}
            expose: true

    # ── redis · 缓存 / 限流 ────────────────────────────────────────────
    - name: redis
      icon: https://raw.githubusercontent.com/zeabur/service-icons/main/marketplace/redis.svg
      template: PREBUILT_V2
      spec:
        source:
          image: redis:7-alpine
        ports:
          - id: database
            port: 6379
            type: TCP
        portForwarding:
          enabled: false
        healthCheck:
          type: TCP
          port: database
        volumes:
          - id: redisdata
            dir: /data
        env:
          REDIS_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          REDIS_PORT:
            default: ${DATABASE_PORT}
            expose: true
          # 借位点 2/4 · redis 自己的 ${PASSWORD} 拿来当首启向导的初始化口令。
          # 放在 redis 上是因为 api 本来就依赖 redis，引用链无环；redis 容器
          # 多一个用不到的环境变量没有副作用。
          # ⚠️ 这把口令**必须非空**：公网上不设口令 = 谁先打开谁就能配置大模型。
          HUNTER_SETUP_TOKEN:
            default: ${PASSWORD}
            expose: true

    # ── llm-shim · 洗 tool schema 的转发层 ─────────────────────────────
    # 只洗 tools[].function.parameters（Gemini 只认 OpenAPI 子集），其余原样转发。
    - name: llm-shim
      icon: https://raw.githubusercontent.com/agentpit-io/hunter-community/main/deploy/zeabur/logo.png
      template: PREBUILT_V2
      spec:
        source:
          image: ghcr.io/agentpit-io/hunter-community-llm-shim:1.1.0
        ports:
          - id: http
            port: 3999
            type: TCP
        portForwarding:
          enabled: false
        healthCheck:
          type: HTTP
          port: http
          http:
            path: /health
        env:
          SHIM_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          SHIM_PORT:
            default: ${HTTP_PORT}
            expose: true
          # 借位点 3/4 · llm-shim 自己的 ${PASSWORD} 当 JWT_SECRET。
          # api 与 opencode 都依赖 llm-shim，引用链无环。
          # ⚠️ api 和 opencode 必须拿到**同一把** JWT_SECRET：api 签发的 token
          #    要由 opencode 的 hunter-auth 插件验签。两边不同的话服务照常启动，
          #    只是一对话就 401。
          # ⚠️ 换掉或丢失 JWT_SECRET = 已保存的大模型 key 全部解不开，要重新填。
          JWT_SECRET:
            default: ${PASSWORD}
            expose: true
          # 大模型地址由首启向导写进数据库后热生效，这里留空即可。
          LLM_BASE_URL:
            default: ""

    # ── api · 后端 + 迁移 + 首启向导 ───────────────────────────────────
    - name: api
      icon: https://raw.githubusercontent.com/agentpit-io/hunter-community/main/deploy/zeabur/logo.png
      template: PREBUILT_V2
      dependencies:
        - postgres
        - redis
        - llm-shim
      spec:
        source:
          image: ghcr.io/agentpit-io/hunter-community-api:1.1.0
        ports:
          - id: http
            port: 8000
            type: TCP
        portForwarding:
          enabled: false
        volumes:
          # 用户自建 / 自装的 SKILL · api 可写
          - id: userskills
            dir: /opt/hunter-user-skills
          # 导入的数据包 · api 可写
          - id: packages
            dir: /opt/hunter-packages
        healthCheck:
          type: HTTP
          port: http
          http:
            path: /api/health
        env:
          API_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          API_PORT:
            default: ${HTTP_PORT}
            expose: true
          # 借位点 4/4 · api 自己的 ${PASSWORD} 当 /api/internal/* 的共享口令。
          # web 与 opencode 都依赖 api，引用链无环。三家必须同值：
          # 不同值时 web 调 /api/internal/ocr/extract 一律 401，症状只是
          # 「上传图片没反应」，和「api 没起来」在前端看不出区别。
          HUNTER_INTERNAL_KEY:
            default: ${PASSWORD}
            expose: true
          JWT_SECRET:
            default: ${JWT_SECRET}
          HUNTER_SETUP_TOKEN:
            default: ${HUNTER_SETUP_TOKEN}
          DATABASE_URL:
            default: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
          REDIS_URL:
            default: redis://${REDIS_HOST}:${REDIS_PORT}/0
          # ⚠️ 公网部署必须是 0。单用户模式（本地默认 1）不要账号密码，
          #    开着等于谁都能拿到 admin token。
          HUNTER_SINGLE_USER:
            default: "0"
          REGISTRATION_MODE:
            default: open
          # 跳过重启动调度器，让全新实例能健康启动
          HUNTER_MINIMAL_BOOT:
            default: "1"
          JWT_ACCESS_TTL:
            default: "3600"
          JWT_REFRESH_TTL:
            default: "2592000"
          # 独立运行模式 · 不指回我们的演示站网关
          HUNTER_UPSTREAM_URL:
            default: ""
          LLM_PROVIDER:
            default: openai_compat
          HUNTER_SKILLS_DIR:
            default: /opt/hunter-skills
          HUNTER_USER_SKILLS_DIR:
            default: /opt/hunter-user-skills
          # ⚠️ **api 也必须知道 shim 在哪** —— 不是只有 opencode 需要。
          # 向导保存后 api 走 PATCH /global/config 把 provider 的 baseURL 推给
          # opencode，那个值取自 **api 容器的** LLM_SHIM_URL；不设就回落到硬编码的
          # `http://llm-shim:3999/v1`。服务名不叫 llm-shim 的部署（Sealos 是
          # `<应用名>-llm-shim`、1Panel 是 `<容器前缀>-llm-shim`、Zeabur 私有网络是
          # `llm-shim.zeabur.internal`）会被推进去一个解析不了的主机名 ——
          # M3 实测：向导五步全绿、engine-ready 也是 true，**但发消息永远没有回复**，
          # 日志里没有任何报错（opencode 就卡在连不上的 baseURL 上）。
          LLM_SHIM_URL:
            default: http://${SHIM_HOST}:${SHIM_PORT}/v1
          # api 要回调 opencode:首启向导保存后 PATCH /global/config 让大模型
          # 热生效(实测 283 毫秒)、装完 SKILL 后 POST /skill/refresh 让模型看见。
          #
          # ⚠️ 这里**不能**用 ${OPENCODE_HOST}：那需要 api 依赖 opencode，而
          #    opencode 已经依赖 api（要 HERMES_API_URL 和两把密钥），会成环 ——
          #    Zeabur 官方最佳实践明写「A 依賴 B，B 不能依賴 A」。
          #    所以按私有网络文档的固定格式 <服务名>.zeabur.internal 直连。
          #    该文档同时写明「改服务名不会改主机名」，即这个名字在服务创建时
          #    定下、之后稳定。
          # 📌 **平台待实测**：本模板没有 Zeabur 账号可验证这一条。若部署后
          #    向导第 5 步提示「配置已保存但热生效失败」，去 opencode 服务的
          #    「网络 → 私有」抄下真实主机名，改这个变量即可，无需重建。
          OPENCODE_URL:
            default: http://opencode.zeabur.internal:3901
          # 留空即可 · 聊天用你自己的 LLM key。想解锁全部工具再去
          # hunter.agentpit.io/dev/api-keys 申请（免费）
          HUNTER_API_KEY:
            default: ""
        instructions:
          - title: 首启向导的初始化口令（第 0 步要填）
            content: ${HUNTER_SETUP_TOKEN}

    # ── opencode · 对话内核（会话正文在卷里）───────────────────────────
    - name: opencode
      icon: https://raw.githubusercontent.com/agentpit-io/hunter-community/main/deploy/zeabur/logo.png
      template: PREBUILT_V2
      dependencies:
        - api
        - llm-shim
      spec:
        source:
          image: ghcr.io/agentpit-io/hunter-community-opencode:1.1.0
        ports:
          - id: http
            port: 3901
            type: TCP
        portForwarding:
          enabled: false
        healthCheck:
          type: TCP
          port: http
        volumes:
          # ⚠️ 会话正文（opencode-local.db，所有对话）必须落在卷上。
          #    2026-09-07 事故：没挂卷时一次容器重建让 33 个用户会话全部消失，
          #    且不可恢复。postgres 里的 chat_session_owner 表**不是**备份，
          #    它只存 session_id ↔ user_id 的归属，正文一个字都不在里面。
          - id: sessions
            dir: /home/hunter/.local
        # 容器以 uid 1001(hunter) 运行，而 Zeabur 的卷是**空目录**、属主是平台给的
        # （官方指南原文："Zeabur Volume defaults to empty directory"）。
        # 不先改属主的话，入口脚本会打印「会话数据目录不可写」并退出（R0 第四节
        # 实测过这个失败）。镜像里 /home/hunter/.local 本身只有两个空目录
        # share/ 与 state/，所以「建目录 + chown」与镜像内容完全等价。
        init:
          - id: fix-owner
            image: busybox:1.36
            command:
              - /bin/sh
              - -c
              - mkdir -p /mnt/sessions/share /mnt/sessions/state && chown -R 1001:1001 /mnt/sessions
            volumes:
              - id: sessions
                mountPath: /mnt/sessions
        env:
          OPENCODE_HOST:
            default: ${CONTAINER_HOSTNAME}
            expose: true
          OPENCODE_PORT:
            default: ${HTTP_PORT}
            expose: true
          JWT_SECRET:
            default: ${JWT_SECRET}
          HUNTER_INTERNAL_KEY:
            default: ${HUNTER_INTERNAL_KEY}
          HERMES_API_URL:
            default: http://${API_HOST}:${API_PORT}
          LLM_SHIM_URL:
            default: http://${SHIM_HOST}:${SHIM_PORT}/v1
          # auto = 模型名含 gemini 时才经 shim
          LLM_SCHEMA_SANITIZE:
            default: auto
          LLM_PROVIDER:
            default: openai_compat
          # 审计日志写进卷内 —— 放 /tmp 的话一次重建就没，而审计的全部意义就是留痕
          HUNTER_AUDIT_PATH:
            default: /home/hunter/.local/share/hunter-audit/AUDIT.jsonl
          # 自部署用户付的是自己的大模型账单，不该被我们限额
          HUNTER_BUDGET_ENABLED:
            default: "false"

    # ── web · 前端 + BFF（唯一对外的服务）──────────────────────────────
    - name: web
      icon: https://raw.githubusercontent.com/agentpit-io/hunter-community/main/deploy/zeabur/logo.png
      template: PREBUILT_V2
      domainKey: PUBLIC_DOMAIN
      dependencies:
        - api
        - opencode
      spec:
        source:
          image: ghcr.io/agentpit-io/hunter-community-web:1.1.0
        ports:
          - id: web
            port: 3000
            type: HTTP
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /
        env:
          NODE_ENV:
            default: production
          # BFF 要回调 api 查会话归属；不传会回落 127.0.0.1:8000 → 503
          HERMES_API_URL:
            default: http://${API_HOST}:${API_PORT}
          # BFF 要反代到 opencode；不传会回落 127.0.0.1:3901（那是 web 自己）→ 502
          OPENCODE_URL:
            default: http://${OPENCODE_HOST}:${OPENCODE_PORT}
          # 必须与 api 同值，否则图片 OCR 一律 401
          HUNTER_INTERNAL_KEY:
            default: ${HUNTER_INTERNAL_KEY}
        instructions:
          - title: 打开 HunterCode
            content: ${ZEABUR_WEB_URL}

localization:
  zh-CN:
    description: 自部署的 AI 投研助手 · A股/港股/美股 · 数据、对话和大模型 key 都留在你自己的实例上
    variables:
      - key: PUBLIC_DOMAIN
        name: 访问域名
        description: 绑定一个域名来打开 HunterCode。部署完成后打开它，按首启向导配置大模型。
  zh-TW:
    description: 自部署的 AI 投研助手 · A股/港股/美股 · 資料、對話和大模型 key 都留在你自己的執行個體上
    variables:
      - key: PUBLIC_DOMAIN
        name: 存取網域
        description: 綁定一個網域來開啟 HunterCode。部署完成後開啟它，依首啟精靈設定大模型。
